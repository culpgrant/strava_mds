name: Release

on:
    workflow_dispatch:
        inputs:
            # Latest commit to include, otherwise use latest on main
            sha:
                description: Commit SHA
                type: string
            dry-run:
                description: Dry Run (do not create release and do not publish to pypi)
                type: boolean
                default: false

env:
    PYTHON_VERSION: '3.11'
    PACKAGE_NAME: 'gculp_data_eng_package'

jobs:
    build_release:
        runs-on: ubuntu-latest
        timeout-minutes: 8
        permissions:
            id-token: write
            contents: read
        env:
            name: pypi
            url: https://pypi.org/project/gculp-data-eng-package
        outputs:
          package-version: ${{ steps.get_version.outputs.VERSION}}
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4
              with:
                ref: ${{ inputs.sha }}

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: ${{ env.PYTHON_VERSION }}

            - name: Install poetry
              uses: snok/install-poetry@v1
              with:
                  virtualenvs-create: true
                  virtualenvs-in-project: true
                  installer-parallel: true

            #----------------------------------------------
            # load cached venv if cache exists
            #----------------------------------------------
            - name: Load cached venv
              id: cached-poetry-dependencies
              uses: actions/cache@v4
              with:
                  path: .venv
                  key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

            #----------------------------------------------
            # install dependencies if cache does not exist
            #----------------------------------------------
            - name: Install dependencies
              if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
              run: poetry install --no-interaction --no-root

            #----------------------------------------------
            # install root project
            #----------------------------------------------
            - name: Install project
              run: poetry install --no-interaction

            #----------------------------------------------
            # Get version from pyproject
            #----------------------------------------------
            - name: Get version from pyproject
              id: get_version
              run: |
                echo "package_version=$(poetry version -s)" >> $GITHUB_OUTPUT

            - name: Build Package
              run: poetry build

            # - name: Publish to PyPI
            #   if: inputs.dry-run == false
            #   uses: pypa/gh-action-pypi-publish@release/v1
            #   with:
            #     verbose: true

            - name: Create Github Release
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                TAG: ${{ steps.get_version.outputs.package_version }}
              run: |
                  gh release create "$TAG" \
                    --repo="$GITHUB_REPOSITORY" \
                    --title="${GITHUB_REPOSITORY#*/} ${TAG#v}" \

            - name: Upload sdist to GitHub release
              run: gh release upload $TAG $FILES --clobber
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                TAG: ${{ steps.get_version.outputs.package_version }}
                FILES: dist/gculp_data_eng_package-*.tar.gz

            - name: Publish GitHub release
              if: inputs.dry-run == false
              run: gh release edit $TAG --draft=false
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                TAG: ${{ steps.get_version.outputs.package_version }}
