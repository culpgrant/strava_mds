name: Build and Publish Devcontainer Docker Image

on:
    push:
        branches:
        - main
    workflow_dispatch:

jobs:
  build_push_to_registry:
    name: Push Devcontainer Docker image to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@5139682d94efc37792e6b54386b5b470a68a4737
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@232fc64e3a4e54539e087c5976439ea54be0959d
        with:
          images: culpgrant/strava_mds_dev_container

      - name: Build and push Docker image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: .
          file: ./.devcontainer/Dockerfile.dev-container
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
