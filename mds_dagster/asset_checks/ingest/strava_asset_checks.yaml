data_tests:

  - asset: raw_ingest_strava_athlete
    engine: polars
    tests:
      - name: not_null
        columns:
          - ID
          - INGESTION_DATE_TIME
      - name: unique
        columns:
          - ID
          - INGESTION_DATE_TIME

  - asset: raw_ingest_strava_equipment
    engine: polars
    tests:
      - name: not_null
        columns:
          - ID
      - name: unique
        columns:
          - ID

